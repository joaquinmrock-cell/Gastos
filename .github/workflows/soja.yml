name: Actualizar precio de la soja
on:
  schedule:
    - cron: "17 13 * * 1-5"
    - cron: "17 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  precio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer precio de la CAC
        run: python scripts/update_price.py
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "precio-soja[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add prices.json
            git commit -m "Precio de la soja $(date -u +%F)"
            git push
          fi
